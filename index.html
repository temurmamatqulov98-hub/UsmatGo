<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usmat Go - Taksi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        h2 { color: #ffcc00; margin: 0; font-size: 22px; }
        .badge { background: #ffcc00; color: #121212; font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        
        .route-box {
            background: #282828;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-group:last-child { margin-bottom: 0; }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 12px;
        }
        .dot.from { background: #4cd137; }
        .dot.to { background: #e84118; }
        
        input, select {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            padding: 6px 0;
        }
        select option { background: #282828; color: #fff; }
        
        .tariff-section { margin-top: 20px; }
        .tariff-title { font-size: 14px; color: #888; margin-bottom: 8px; }
        
        .tariff-card {
            background: #282828;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .tariff-info .name { font-weight: bold; font-size: 16px; }
        .tariff-info .desc { font-size: 12px; color: #aaa; margin-top: 3px; }
        .tariff-price { font-size: 16px; font-weight: bold; color: #ffcc00; }

        .phone-section { margin-top: 20px; }
        .phone-input {
            background: #282828;
            border-radius: 12px;
            padding: 10px 15px;
        }

        button {
            width: 100%;
            background-color: #ffcc00;
            color: #121212;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Usmat Go</h2>
        <span class="badge">PRO v2.0</span>
    </div>
    
    <!-- Marshrut qismi -->
    <div class="route-box">
        <div class="input-group">
            <div class="dot from"></div>
            <input type="text" id="pickup" placeholder="Qayerdan (Masalan: Avtostansiya)">
        </div>
        <hr style="border: 0; border-top: 1px solid #383838; margin: 8px 0;">
        <div class="input-group">
            <div class="dot to"></div>
            <select id="destination">
                <option value="Usmat Markazi - 10 000 so'm">Usmat Markazi (10 000 so'm)</option>
                <option value="Qishloq qismiga - 15 000 so'm">Qishloq qismiga (15 000 so'm)</option>
                <option value="Maktab atrofi - 12 000 so'm">Maktab atrofi (12 000 so'm)</option>
                <option value="Bozor - 10 000 so'm">Bozor (10 000 so'm)</option>
                <option value="Dostavka - 15 000 so'm">Dostavka (15 000 so'm)</option>
            </select>
        </div>
    </div>

    <!-- Tarif -->
    <div class="tariff-section">
        <div class="tariff-title">TANLANGAN TARIF</div>
        <div class="tariff-card">
            <div class="tariff-info">
                <div class="name">🚕 Standart Taksi</div>
                <div class="desc">Tezkor chaqiruv va qulaylik</div>
            </div>
            <div class="tariff-price" id="priceDisplay">10 000 so'm</div>
        </div>
    </div>

    <!-- Telefon raqam -->
    <div class="phone-section">
        <div class="tariff-title">BOG'LANISH UCHUN RAQAM</div>
        <div class="phone-input">
            <input type="tel" id="phone" placeholder="+998 90 123 45 67">
        </div>
    </div>

    <button onclick="sendOrder()">Taksi chaqirish</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    // Narxni tanlangan yo'nalishga qarab avtomatik o'zgartirish
    document.getElementById('destination').addEventListener('change', function() {
        let val = this.value;
        let price = "10 000 so'm";
        if(val.includes("15 000")) price = "15 000 so'm";
        if(val.includes("12 000")) price = "12 000 so'm";
        document.getElementById('priceDisplay').innerText = price;
    });

    function sendOrder() {
        let pickup = document.getElementById('pickup').value;
        let dest = document.getElementById('destination').value;
        let phone = document.getElementById('phone').value;

        if(!pickup) {
            alert("Iltimos, qayerdan ketishingizni kiriting!");
            return;
        }
        if(!phone) {
            alert("Iltimos, telefon raqamingizni yozing!");
            return;
        }

        let orderData = {
            pickup: pickup,
            destination: dest,
            phone: phone
        };

        // Ma'lumotni Telegram botga yuborish
        tg.sendData(JSON.stringify(orderData));
        tg.close();
    }
</script>

</body>
</html>
